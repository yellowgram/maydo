name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maydo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d maydo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/maydo
      DATABASE_URL_API: postgres://maydo_api:maydo_api_dev@127.0.0.1:5432/maydo
      DATABASE_URL_WORKER: postgres://maydo_worker:maydo_worker_dev@127.0.0.1:5432/maydo
      MAYDO_KEY_PEPPER: ci-pepper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
